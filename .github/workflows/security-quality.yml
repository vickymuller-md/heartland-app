name: Security and quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
      CRON_SECRET: ci-cron-placeholder-not-for-runtime
      ACCESS_REQUEST_RATE_LIMIT_SECRET: ci-rate-limit-placeholder-not-for-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heartland-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase
        run: npx supabase start
      - name: Rebuild schema from migrations
        run: npx supabase db reset --local
      - name: Record isolated database posture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p database-evidence
          npx supabase --version > database-evidence/cli-version.txt
          docker exec -i supabase_db_heartland-app psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL' | tee database-evidence/posture.txt
          SELECT version();
          SELECT current_user, current_database();
          SELECT rolname, rolsuper, rolinherit, rolbypassrls FROM pg_roles
            WHERE rolname IN ('postgres','anon','authenticated','service_role') ORDER BY rolname;
          DO $$ BEGIN
            IF (SELECT rolsuper FROM pg_roles WHERE rolname=current_user) THEN
              RAISE EXCEPTION 'pgTAP runner must not be a superuser';
            END IF;
          END $$;
          SELECT pg_get_userbyid(defaclrole) AS owner, defaclnamespace::regnamespace, defaclobjtype, defaclacl
            FROM pg_default_acl WHERE defaclnamespace IN (0,'public'::regnamespace);
          SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;
          SQL
      - name: Lint database
        run: npx supabase db lint --local --level warning
      - name: Run pgTAP authorization contracts
        shell: bash
        run: |
          set -o pipefail
          npx supabase test db 2>&1 | tee database-evidence/pgtap.txt
      - name: Preserve database verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heartland-database-verification
          path: database-evidence/
          if-no-files-found: warn
          retention-days: 30
